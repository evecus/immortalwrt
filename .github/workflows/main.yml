name: Build CR660x (mtwifi for Redmi AX1800)

on:
  workflow_dispatch:
  push:
    branches: [mt7915_mtwifi]
    paths:
      - "config-cr660x.seed"
      - "package/**"
      - "target/**"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 lib32stdc++6 libc6-dev-i386 libelf-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev \
            libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool \
            lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pip python3-ply python3-docutils python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure (CR660x / Redmi AX1800)
        run: |
          cp config-cr660x.seed .config
          make defconfig
          grep -E "DEVICE_xiaomi_mi-router-cr660|kmod-mt7915e|luci-app-mtwifi" .config

      - name: Build firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Check output
        run: |
          ls -la bin/targets/ramips/mt7621/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-mtwifi-cr660x
          path: bin/targets/ramips/mt7621/
          retention-days: 14
